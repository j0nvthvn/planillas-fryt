# Lo que antes se corría a mano antes de cada commit. No toca el despliegue:
# Vercel construye por su cuenta desde la misma rama.
name: v2

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  verificar:
    name: lint, tipos, tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # `--mode staging` para que exista VITE_SUPABASE_URL (.env.staging está
      # versionado): sin eso, cualquier test que importe el cliente falla al
      # cargarlo. Los tests que tocan la base se saltan solos sin
      # SMOKE_PASSWORD, que no está acá (se corren a mano, ver v2/README.md).
      - run: pnpm test --mode staging
      - run: pnpm build
      # Plantillas de correo (supabase/functions/_shared/correo): TypeScript
      # puro, se prueba con Node y se chequean tipos con el tsc de la v2.
      - name: correos
        run: |
          node --test ../supabase/functions/_shared/correo/periodos.test.ts
          pnpm exec tsc --noEmit --allowImportingTsExtensions --target es2022 --lib es2022,dom \
            --module esnext --moduleResolution bundler --strict --skipLibCheck --types node \
            ../supabase/functions/_shared/correo/{cierre,periodo,envio}.ts ../scripts/correos/vista-previa.ts
