<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Barra de estado: arranca con el fondo de la página (--canvas); la banda de
         Hoy y de Ajustes la pone de su color mientras cubre el tope (lib/barraEstado). -->
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FrytControl" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>FrytControl</title>
    <script>
      // Tema antes del primer render, para evitar el destello claro→oscuro
      // (también en la barra de estado).
      (function () {
        try {
          var t = localStorage.getItem('tema') || 'sistema'
          if (t === 'oscuro' || (t === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0D10')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
