<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planilla Caja · Ingresar turno</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  /* ── Tema base (Papel cálido) ── */
  :root {
    --bg: #F1F1EC;  --surface: #FFFFFF;  --surface-alt: #FAFAF7;
    --ink: #191B1F;  --ink-soft: #4A4D54;  --muted: #8C8E88;  --faint: #B7B9B2;
    --line: rgba(22,24,28,0.09);  --line-soft: rgba(22,24,28,0.05);
    --navy: #33518C;  --navy-tint: #E8EDF6;
    --amber: #B07B1E;  --amber-tint: #F6EEDC;
    --terra: #BC4A30;  --terra-tint: #F7E7E1;
    --seg: #ECECE6;  --handle: #D6D7D0;  --dash: rgba(22,24,28,0.18);
    --accent: #1E7A4F;  --accent-tint: #E6F1EA;
    --ui-font: 'Schibsted Grotesk', -apple-system, system-ui, sans-serif;
    --page: radial-gradient(1200px 800px at 50% -10%, #FBFBF8 0%, #EDEDE7 55%, #E6E6DF 100%);
  }
  /* Ambiente: Nieve (limpio, frío) */
  body[data-amb="nieve"] {
    --bg: #EEF1F3;  --surface: #FFFFFF;  --surface-alt: #F5F7F9;
    --ink: #14181D;  --ink-soft: #444B53;  --muted: #8893A0; --faint: #B6BFC8;
    --line: rgba(20,28,38,0.10);  --line-soft: rgba(20,28,38,0.05);
    --seg: #E4E9ED;  --handle: #CCD4DB;  --dash: rgba(20,28,38,0.18);
    --page: radial-gradient(1200px 800px at 50% -10%, #FFFFFF 0%, #E7ECF0 60%, #DDE4EA 100%);
  }
  /* Ambiente: Noche (oscuro) */
  body[data-amb="noche"] {
    --bg: #15171C;  --surface: #1E2128;  --surface-alt: #24272F;
    --ink: #F3F4F2;  --ink-soft: #B9BDC4;  --muted: #80858E;  --faint: #5C616B;
    --line: rgba(255,255,255,0.10);  --line-soft: rgba(255,255,255,0.05);
    --navy-tint: rgba(120,160,235,0.16);  --amber-tint: rgba(230,180,90,0.16);
    --terra-tint: rgba(235,120,90,0.18);  --accent-tint: rgba(255,255,255,0.08);
    --seg: rgba(255,255,255,0.08);  --handle: rgba(255,255,255,0.22);  --dash: rgba(255,255,255,0.20);
    --page: radial-gradient(1200px 800px at 50% -10%, #20232A 0%, #15171C 60%, #0E1014 100%);
  }

  body {
    font-family: var(--ui-font);
    -webkit-font-smoothing: antialiased;
    background: var(--page);
    min-height: 100%;
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: background .4s ease;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  input::placeholder { color: var(--faint); }
  input { -webkit-appearance: none; }
  #stage { position: relative; }
  @media (max-width: 460px) {
    #stage > div { box-shadow: none !important; border-radius: 0 !important; }
  }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1E7A4F"/>
    <rect x="34" y="22" width="32" height="56" rx="6" fill="#fff"/>
    <rect x="40" y="30" width="20" height="10" rx="2" fill="#E6F1EA"/>
    <circle cx="44" cy="52" r="3" fill="#1E7A4F"/><circle cx="50" cy="52" r="3" fill="#33518C"/><circle cx="56" cy="52" r="3" fill="#1E7A4F"/>
    <circle cx="44" cy="62" r="3" fill="#33518C"/><circle cx="50" cy="62" r="3" fill="#1E7A4F"/><circle cx="56" cy="62" r="3" fill="#33518C"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="approachA.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": [
    "#7A4F86",
    "#EFE6F2"
  ],
  "tipografia": "Moderna",
  "ambiente": "Papel"
}/*EDITMODE-END*/;

const FONTS = {
  Moderna: "'Schibsted Grotesk', -apple-system, system-ui, sans-serif",
  Suave:   "'Hanken Grotesk', -apple-system, system-ui, sans-serif",
  Técnica: "'Space Grotesk', -apple-system, system-ui, sans-serif",
};
const AMB = { Papel: '', Nieve: 'nieve', Noche: 'noche' };

const ACCENTS = [
  ["#1E7A4F", "#E6F1EA"], // Verde caja
  ["#BC5A3C", "#F6E7DF"], // Terracota
  ["#7A4F86", "#EFE6F2"], // Ciruela
  ["#127E78", "#DFF0EE"], // Petróleo
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const dark = t.ambiente === 'Noche';

  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--accent', t.accent[0]);
    r.style.setProperty('--accent-tint', t.accent[1]);
    r.style.setProperty('--ui-font', FONTS[t.tipografia] || FONTS.Moderna);
    document.body.dataset.amb = AMB[t.ambiente] || '';
  }, [t.accent, t.tipografia, t.ambiente]);

  return (
    <React.Fragment>
      <IOSDevice width={390} height={844} dark={dark}>
        <ApproachA />
      </IOSDevice>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Acento de marca" />
        <TweakColor label="Color" value={t.accent} options={ACCENTS}
          onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Tipografía" />
        <TweakRadio label="Personalidad" value={t.tipografia}
          options={['Moderna', 'Suave', 'Técnica']}
          onChange={(v) => setTweak('tipografia', v)} />

        <TweakSection label="Ambiente" />
        <TweakRadio label="Superficie" value={t.ambiente}
          options={['Papel', 'Nieve', 'Noche']}
          onChange={(v) => setTweak('ambiente', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Escala el teléfono para caber en cualquier ventana sin recortes
function fit() {
  const stage = document.getElementById('stage');
  const dev = stage.firstElementChild?.firstElementChild;
  if (!dev) { requestAnimationFrame(fit); return; }
  const pad = window.innerWidth <= 460 ? 0 : 24;
  const s = Math.min(1, (window.innerHeight - pad * 2) / 844, (window.innerWidth - pad * 2) / 390);
  stage.style.transform = `scale(${s})`;
  stage.style.transformOrigin = 'center center';
}
window.addEventListener('resize', fit);
setTimeout(fit, 80);
</script>
</body>
</html>
